name: Publish

# release-please keeps a Release PR open with the next version and CHANGELOG
# entries, computed from the Conventional Commits since the last release.
# Merging that PR tags vX.Y.Z, creates the GitHub Release and publishes to npm.
# Versions with a pre-release part (1.1.0-beta.1) go to the `next` dist-tag.
#
# The npm publish runs in this workflow, not on the tag: tags pushed with the
# default GITHUB_TOKEN do not trigger other workflows. The file name stays
# publish.yml because npm trusted publishing is bound to it.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub Releases
      pull-requests: write # the Release PR
      issues: write # labels on the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  check:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release-please, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "DIST_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - run: npm ci
      # trusted publishing: npm exchanges the OIDC token, no npm token needed
      - run: npm publish --provenance --access public --tag "$DIST_TAG"
