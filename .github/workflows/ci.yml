name: CI

on:
  push:
    branches: [main]
  pull_request:
  # reused by publish.yml before a release
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every major the package supports (engines: >=22)
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack
        run: npm pack
      - name: Keep the package
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: takesix-react-package
          path: '*.tgz'
